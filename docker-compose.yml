services:
  postgres:
    # pgvector/pgvector:pg16 is a stock Postgres 16 image with the pgvector
    # extension built in (CREATE EXTENSION vector; still required) — same
    # base image otherwise, swapped so M3 (semantic search) has it available.
    image: pgvector/pgvector:pg16
    container_name: solaris-memory-postgres
    environment:
      POSTGRES_DB: solaris_memory
      POSTGRES_USER: solaris
      POSTGRES_PASSWORD: solaris
    ports:
      # Host port 5434 so this doesn't clash with other Postgres containers
      # already running on this machine (e.g. one on 5433 for another project).
      - "5434:5432"
    volumes:
      - solaris-memory-postgres-data:/var/lib/postgresql/data

volumes:
  solaris-memory-postgres-data:
