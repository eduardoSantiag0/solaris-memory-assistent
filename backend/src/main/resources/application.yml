server:
  port: 8080

spring:
  application:
    name: solaris-memory-assistant
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:solaris_memory}
    username: ${DB_USER:solaris}
    password: ${DB_PASSWORD:solaris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  encryption:
    # Base64 AES-256 key for field-level encryption of memory content (see
    # AesGcmEncryptor). This default is for local dev only — generate a real
    # one per environment with:
    #   python -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
    # and set it via APP_ENCRYPTION_KEY, never commit a real key to the repo.
    key: ${APP_ENCRYPTION_KEY:QKKy470XASV8lRE1o+tMmgCGuoU2s0x1Eb5bX6IysXs=}
  attachments:
    # Images/PDFs attached to a memory (RF: anexos) — not field-encrypted,
    # unlike `content`: this VM is no longer shared with other accounts.
    max-size-mb: ${APP_ATTACHMENT_MAX_SIZE_MB:10}
  auth:
    username: ${APP_USER:admin}
    # BCrypt hash of the single-user password. This default hashes the
    # placeholder "admin" — override APP_PASSWORD_HASH for anything real.
    password-hash: ${APP_PASSWORD_HASH:$2b$10$rbAB5CdYagtSzDcpsQ/iPu96Xjg5ekfsWm4LAI7c0NuwN1UH36426}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-in-env-it-must-be-at-least-32-bytes-long}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  idempotency:
    chat-cache-max-entries: 500
    chat-cache-ttl-seconds: 120
  embeddings:
    # Semantic search (doc section 6/section 14 M3) — optional by design:
    # "pgvector/Ollama podem ser habilitados quando a recuperação semântica
    # melhorar a experiência". Disable if no Ollama is reachable; the app
    # falls back to M1's plain text search either way (RF-05 never lets
    # vector similarity override an exact/text match regardless of this flag).
    enabled: ${APP_EMBEDDINGS_ENABLED:true}
    # "ollama" (local) ou "gemini" (pedido do usuário 15/10 — embeddings
    # assimétricos document/query via GEMINI_API_KEY, mesma chave usada
    # pelo app.gemini.* abaixo). Trocar de provider invalida os embeddings
    # já salvos (espaços vetoriais diferentes) — rode POST /api/v1/admin/
    # reembed depois de trocar.
    provider: ${APP_EMBEDDINGS_PROVIDER:ollama}
    ollama-base-url: ${APP_OLLAMA_URL:http://localhost:11434}
    model: ${APP_EMBEDDINGS_MODEL:nomic-embed-text}
    # Must match the DB column (V2/V3 migrations) and whatever the active
    # provider actually outputs — Ollama/nomic-embed-text is fixed at 768;
    # Gemini needs APP_EMBEDDINGS_DIMENSIONS=1536 (see V3 migration notes:
    # pgvector's HNSW index caps at 2000 dims, so the model's native 3072
    # isn't an option, and the truncated 768 measurably hurt separation
    # between related/unrelated short texts in local testing 15/10).
    dimensions: ${APP_EMBEDDINGS_DIMENSIONS:768}
    # Correções 14/10 item 1 (RF-04/CT-05/CT-13): cosine distance above this
    # is treated as "not actually related" and discarded, so an unrelated
    # question never surfaces the "closest, but still wrong" memory. 0.42
    # was picked by embedding this project's own CT fixtures with the local
    # nomic-embed-text model (see calibration notes in ChatQueryServiceTest) —
    # it is a pragmatic cutoff for this specific small model and short
    # Portuguese sentences, not a universal guarantee; thematically adjacent
    # but unrelated pairs can still occasionally slip through. Acts as a
    # coarse sanity ceiling now; semantic-margin below does the fine-grained
    # disambiguation (needed for Gemini — see its own comment).
    max-distance: ${APP_EMBEDDINGS_MAX_DISTANCE:0.42}
    # Achado 15/10: com o Gemini, até conteúdo totalmente não relacionado
    # ("minha senha do wifi" pra uma pergunta sobre residência) mede
    # distância de cosseno parecida com conteúdo de verdade relacionado —
    # tudo ficou medido entre ~0.35 e ~0.42 num teste local (dimensão
    # 1536), faixa estreita demais pra um corte absoluto separar bem. Em vez de aceitar qualquer
    # candidato abaixo de max-distance, só considera "empatado" com o
    # melhor resultado (e por isso parte de um conflito de verdade) quem
    # fica a até semantic-margin de distância dele — o resto é descartado
    # mesmo estando dentro do max-distance.
    semantic-margin: ${APP_EMBEDDINGS_SEMANTIC_MARGIN:0.02}
  gemini:
    # Pedido explícito do usuário em 15/10 — só reformula a frase de uma
    # resposta já encontrada (nunca decide o que é fato, nunca vê conteúdo
    # SENSITIVE); sempre com fallback silencioso pro texto literal se
    # desabilitado, sem key ou se a chamada falhar (mesmo princípio de
    # RF-10 dos embeddings: nunca travar a resposta por causa disso).
    enabled: ${APP_GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${APP_GEMINI_MODEL:gemini-flash-latest}

logging:
  level:
    root: INFO
    dev.solaris.memory: INFO
  pattern:
    # Never include request/response bodies here — memory content, RG-like
    # identifiers and tokens must never reach the logs (RNF-05).
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"
