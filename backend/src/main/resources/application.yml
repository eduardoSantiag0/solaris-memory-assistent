server:
  port: 8080

spring:
  application:
    name: solaris-memory-assistant
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:solaris_memory}
    username: ${DB_USER:solaris}
    password: ${DB_PASSWORD:solaris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  encryption:
    # Base64 AES-256 key for field-level encryption of memory content (see
    # AesGcmEncryptor). This default is for local dev only — generate a real
    # one per environment with:
    #   python -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
    # and set it via APP_ENCRYPTION_KEY, never commit a real key to the repo.
    key: ${APP_ENCRYPTION_KEY:QKKy470XASV8lRE1o+tMmgCGuoU2s0x1Eb5bX6IysXs=}
  auth:
    username: ${APP_USER:admin}
    # BCrypt hash of the single-user password. This default hashes the
    # placeholder "admin" — override APP_PASSWORD_HASH for anything real.
    password-hash: ${APP_PASSWORD_HASH:$2b$10$rbAB5CdYagtSzDcpsQ/iPu96Xjg5ekfsWm4LAI7c0NuwN1UH36426}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-in-env-it-must-be-at-least-32-bytes-long}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  idempotency:
    chat-cache-max-entries: 500
    chat-cache-ttl-seconds: 120
  embeddings:
    # Semantic search (doc section 6/section 14 M3) — optional by design:
    # "pgvector/Ollama podem ser habilitados quando a recuperação semântica
    # melhorar a experiência". Disable if no Ollama is reachable; the app
    # falls back to M1's plain text search either way (RF-05 never lets
    # vector similarity override an exact/text match regardless of this flag).
    enabled: ${APP_EMBEDDINGS_ENABLED:true}
    ollama-base-url: ${APP_OLLAMA_URL:http://localhost:11434}
    model: ${APP_EMBEDDINGS_MODEL:nomic-embed-text}
    dimensions: 768
    # Correções 14/10 item 1 (RF-04/CT-05/CT-13): cosine distance above this
    # is treated as "not actually related" and discarded, so an unrelated
    # question never surfaces the "closest, but still wrong" memory. 0.42
    # was picked by embedding this project's own CT fixtures with the local
    # nomic-embed-text model (see calibration notes in ChatQueryServiceTest) —
    # it is a pragmatic cutoff for this specific small model and short
    # Portuguese sentences, not a universal guarantee; thematically adjacent
    # but unrelated pairs can still occasionally slip through.
    max-distance: ${APP_EMBEDDINGS_MAX_DISTANCE:0.42}

logging:
  level:
    root: INFO
    dev.solaris.memory: INFO
  pattern:
    # Never include request/response bodies here — memory content, RG-like
    # identifiers and tokens must never reach the logs (RNF-05).
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"
