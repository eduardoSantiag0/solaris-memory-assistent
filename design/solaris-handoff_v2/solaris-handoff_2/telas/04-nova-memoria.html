<style>
body{margin:0}
a{color:#172621}a:hover{color:#995F4C}
.mono{font-family:'IBM Plex Mono',monospace}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.4px;color:#172621}
.ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;flex-shrink:0}

.brand{margin:0;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:400;letter-spacing:3px;color:#3f5045}
.ib{width:44px;height:44px;flex-shrink:0;box-sizing:border-box;border:1px solid transparent;background:transparent;color:#172621;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;padding:0;text-decoration:none}

.tab::after{content:'';position:absolute;top:-8px;bottom:-8px;left:-14px;right:0}
.tab-on{background:#B8A47B;color:#172621}

.bs{min-height:48px;border:1px solid #172621;border-radius:0;background:transparent;color:#172621;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bd{min-height:48px;border:0;border-radius:0;background:#995F4C;color:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bd:hover{color:#FFFFFF}
.ficha{display:block;text-decoration:none;color:#172621;background:#F3F1E8;border:0}
.ficha:hover{color:#172621}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px dashed #A9A596}
.stamp{font-family:'IBM Plex Mono',monospace;font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:0;background:#DCE2D8;color:#172621}
.stamp-a{background:#EEDCD3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bar{display:block;position:relative;height:1px;background:#C9C6B8;overflow:hidden}
.bar span{position:absolute;top:0;left:0;height:1px;width:30%;background:#172621;animation:bar 1.6s ease-in-out infinite alternate}
.sn{flex-shrink:0;display:flex;gap:24px;padding:0 20px;height:46px;box-sizing:border-box;border-bottom:1px solid #CFCBBE}
.sni{display:flex;align-items:center;gap:8px;font-size:15px;color:#3f5045;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.sni[aria-current]{color:#172621;font-weight:600;border-bottom-color:#995F4C}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:400;padding:1px 6px;background:#DDD9CB;color:#172621}
@keyframes bar{from{left:0}to{left:70%}}
@media (prefers-reduced-motion: reduce){.bar span{animation:none}}
.rc{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid #172621;cursor:pointer;color:#172621;font-family:'IBM Plex Sans',sans-serif;border-radius:0;min-height:60px;box-sizing:border-box}
.dot{width:14px;height:14px;border:1px solid #172621;border-radius:50%;flex-shrink:0;margin-top:4px;box-sizing:border-box}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:1px solid #172621;background:#F3F1E8;flex-shrink:0;cursor:pointer}
.chk:checked{background:#172621;box-shadow:inset 0 0 0 4px #F3F1E8}
</style>
