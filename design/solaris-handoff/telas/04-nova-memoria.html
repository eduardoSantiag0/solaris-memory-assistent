<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova memória</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#172621}a:hover{color:#995F4C}
.mono{font-family:'IBM Plex Mono',monospace}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.4px}
.ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;flex-shrink:0}
.ib{width:44px;height:44px;flex-shrink:0;border:1px solid #172621;background:transparent;color:#172621;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;padding:0}
.rc{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid #172621;cursor:pointer;color:#172621;font-family:'IBM Plex Sans',sans-serif;border-radius:0;min-height:60px;box-sizing:border-box}
.dot{width:14px;height:14px;border:1px solid #172621;border-radius:50%;flex-shrink:0;margin-top:3px;box-sizing:border-box}
.bp{width:100%;min-height:52px;border:0;border-radius:0;background:#172621;color:#E8E5D8;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #995F4C;outline-offset:2px}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:1px solid #172621;background:#F3F1E8;flex-shrink:0;cursor:pointer}
.chk:checked{background:#172621;box-shadow:inset 0 0 0 4px #F3F1E8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8E5D8; color: #172621; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #172621">
<span style="width: 30px; height: 30px; flex-shrink: 0; background: #172621; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="12" fill="#B8A47B"/><path d="M8 40h48" stroke="#E8E5D8" stroke-width="4" stroke-linecap="square" fill="none"/><g fill="#B8A47B" opacity="0.6"><rect x="21" y="46" width="22" height="4"/><rect x="27" y="53" width="10" height="4"/></g></svg></span>
<span class="mono" style="font-size: 16px; font-weight: 600; letter-spacing: 1px; flex-grow: 1">solaris</span>
<span class="meta">VPN · OK</span>
</header>
<div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px">
<div style="align-self: flex-end; background: #B8A47B; padding: 10px 12px; font-size: 16px">Qual é meu RG?</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(23, 38, 33, 0.62)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="nm-t" style="position: absolute; left: 0; right: 0; bottom: 0; background: #E8E5D8; border-top: 1px solid #172621; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 3px; background: #172621"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="nm-t" class="mono" style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .5px">Nova memória</h2>
<a href="02-chat.html" class="ib" aria-label="Fechar" style="border-color: transparent"><svg class="ln" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div role="radiogroup" aria-label="Tipo de memória" style="display: flex; flex-direction: column; gap: 8px">
<button class="rc" role="radio" aria-checked="false" style="background: transparent">
<span class="dot" style="background: transparent"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Permanente</b><span style="font-size: 14px">Fica até você excluir.</span></span>
</button>
<button class="rc" role="radio" aria-checked="true" style="background: #B8A47B">
<span class="dot" style="background: #172621"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Temporária</b><span style="font-size: 14px">Sai das respostas depois do prazo.</span></span>
</button>
</div>


<div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid #172621; border-bottom: 1px solid #172621; padding: 10px 0">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span class="meta">VALE POR</span>
<span style="font-size: 14px">até 15/10, 21:40</span>
</div>
<button class="ib" aria-label="Menos um dia"><svg class="ln" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
<span class="mono" aria-live="polite" style="min-width: 74px; text-align: center; font-size: 17px; font-weight: 600">2 dias</span>
<button class="ib" aria-label="Mais um dia"><svg class="ln" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>


<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nm-txt" class="meta">O QUE VOCÊ QUER LEMBRAR?</label>
<textarea id="nm-txt" rows="3" style="box-sizing: border-box; width: 100%; resize: none; border: 1px solid #172621; border-radius: 0; background: #F3F1E8; color: #172621; padding: 10px 12px; font-size: 16px; line-height: 1.45; font-family: 'IBM Plex Sans', sans-serif">Deixei a chave do carro na gaveta da cozinha.</textarea>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px">
<span style="display: flex; flex-direction: column; gap: 2px"><span class="meta">DATA DO EVENTO</span><span style="font-size: 14px">Não informada</span></span>
<button class="mono" style="min-height: 44px; padding: 0 12px; border: 1px solid #172621; background: transparent; color: #172621; font-size: 14px; border-radius: 0; cursor: pointer">Definir</button>
</div>

<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer"><input class="chk" type="checkbox"><span style="display: flex; flex-direction: column; gap: 2px"><span>Marcar como sensível</span><span class="meta">MASCARADA NAS RESPOSTAS</span></span></label>

<button class="bp">Salvar memória</button>
<div class="meta" style="text-align: center">Equivale a <b style="font-weight: 600">/add-temp 2</b> no chat</div>
</section>

</div>
</body>
</html>
