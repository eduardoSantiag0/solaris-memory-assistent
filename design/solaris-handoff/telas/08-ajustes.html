<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Ajustes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#172621}a:hover{color:#995F4C}
.mono{font-family:'IBM Plex Mono',monospace}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.4px}
.ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;flex-shrink:0}
.nv{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#172621;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;border-top:2px solid transparent;margin-top:-1px}
.nv[aria-current]{border-top-color:#995F4C;font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #995F4C;outline-offset:2px}
.sec{display:flex;flex-direction:column;border-top:1px solid #172621;padding-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;font-size:15px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;margin:0;border:1px solid #172621;background:#F3F1E8;flex-shrink:0;cursor:pointer;position:relative}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#4a5d4f}
.sw:checked{background:#172621}
.sw:checked::after{left:21px;background:#B8A47B}
.rad{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1px solid #172621;border-radius:50%;background:#F3F1E8;flex-shrink:0;cursor:pointer}
.rad:checked{background:#172621;box-shadow:inset 0 0 0 4px #F3F1E8}
.bs{min-height:44px;border:1px solid #172621;border-radius:0;background:transparent;color:#172621;font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.ok{font-family:'IBM Plex Mono',monospace;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.ok::before{content:'';width:8px;height:8px;background:#566C5B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8E5D8; color: #172621; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #172621">
<span style="width: 30px; height: 30px; flex-shrink: 0; background: #172621; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="12" fill="#B8A47B"/><path d="M8 40h48" stroke="#E8E5D8" stroke-width="4" stroke-linecap="square" fill="none"/><g fill="#B8A47B" opacity="0.6"><rect x="21" y="46" width="22" height="4"/><rect x="27" y="53" width="10" height="4"/></g></svg></span>
<h1 class="mono" style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 1px; flex-grow: 1">Ajustes</h1>
</header>

<main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px">

<section class="sec" aria-labelledby="s1">
<h2 id="s1" class="meta" style="margin: 0 0 4px; font-weight: 600">CONEXÃO</h2>
<div class="row"><span>VPN · WireGuard</span><span class="ok">CONECTADA</span></div>
<div class="row"><span>Servidor (API)</span><span class="ok">OK</span></div>
<div class="row"><span>Modelo local</span><span class="ok">PRONTO</span></div>
<div style="display: flex; gap: 8px; margin-top: 6px">
<label for="srv" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Endereço do servidor</label>
<input id="srv" type="text" value="[ENDEREÇO DO SERVIDOR]" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1px solid #172621; border-radius: 0; padding: 0 12px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; background: #F3F1E8; color: #172621">
<button class="bs" style="padding: 0 14px">Testar</button>
</div>
</section>

<section class="sec" aria-labelledby="s2">
<h2 id="s2" class="meta" style="margin: 0; font-weight: 600">APARÊNCIA</h2>
<a href="09-aparencia.html" class="opt" style="text-decoration: none; color: #172621; min-height: 56px">
<span style="display: flex; flex-direction: column; gap: 2px"><span>Tema, paleta e estilos</span><span class="meta">ESTAÇÃO · SEGUIR O ANDROID</span></span>
<span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="display: flex; border: 1px solid #172621"><span style="width: 12px; height: 18px; background: #172621"></span><span style="width: 12px; height: 18px; background: #566C5B"></span><span style="width: 12px; height: 18px; background: #E8E5D8"></span><span style="width: 12px; height: 18px; background: #B8A47B"></span><span style="width: 12px; height: 18px; background: #995F4C"></span></span><svg class="ln" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
</a>
</section>

<section class="sec" aria-labelledby="s3">
<h2 id="s3" class="meta" style="margin: 0; font-weight: 600">PRIVACIDADE</h2>
<label class="opt"><span>Pedir biometria ao abrir</span><input class="sw" type="checkbox" role="switch" checked></label>
<label class="opt"><span>Mascarar dados sensíveis</span><input class="sw" type="checkbox" role="switch" checked></label>
<label class="opt"><span style="display: flex; flex-direction: column"><span>Ocultar de novo depois de</span><span class="meta">30 SEGUNDOS</span></span><input class="sw" type="checkbox" role="switch" checked></label>
<label class="opt"><span>Bloquear capturas de tela</span><input class="sw" type="checkbox" role="switch" checked></label>
<label class="opt"><span>Mostrar texto nas notificações</span><input class="sw" type="checkbox" role="switch"></label>
</section>

<section class="sec" aria-label="Dados e sessão" style="flex-direction: row; gap: 12px; padding-top: 12px">
<button class="bs" style="flex: 1 1 0">Limpar cache</button>
<button class="bs" style="flex: 1 1 0; border-color: #995F4C; color: #7a4434">Encerrar sessão</button>
</section>
</main>

<a href="08-ajustes.html" class="nv" aria-current="page"><svg class="ln" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M16 7h4M4 17h2M10 17h10"/><rect x="12" y="5" width="4" height="4"/><rect x="6" y="15" width="4" height="4"/></svg>AJUSTES</a>
</nav>

</div>
</body>
