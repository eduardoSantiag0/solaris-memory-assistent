<!doctype html>
<html lang="pt-BR">
<head>

<title>Aparência</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.tx{background-image:conic-gradient(rgba(23,38,33,0.05) 25%,transparent 0 50%,rgba(23,38,33,0.05) 0 75%,transparent 0);background-size:4px 4px}
a{color:#172621}a:hover{color:#995F4C}
.mono{font-family:'IBM Plex Mono',monospace}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.4px;color:#172621}
.ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;flex-shrink:0}
.hd{height:56px;flex-shrink:0;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 20px;border-bottom:1px solid #CFCBBE}
.brand{margin:0;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:400;letter-spacing:3px;color:#3f5045}
.ib{width:44px;height:44px;flex-shrink:0;box-sizing:border-box;border:1px solid transparent;background:transparent;color:#172621;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;padding:0;text-decoration:none}
.ibb{background:#DDD9CB}
.send{width:44px;height:44px;flex-shrink:0;border:0;background:#995F4C;color:#E8E5D8;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;padding:0}
.in{flex-grow:1;min-width:0;height:44px;box-sizing:border-box;border:0;border-bottom:2px solid #172621;border-radius:0;padding:0 14px;font-size:16px;font-family:'IBM Plex Sans',sans-serif;background:#F3F1E8;color:#172621}
.in::placeholder{color:rgba(23,38,33,0.42)}
.cmp{flex-shrink:0;border-top:1px solid #CFCBBE;padding:12px 16px 18px;display:flex;gap:10px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #995F4C;outline-offset:2px}
.ub{align-self:flex-end;max-width:78%;background:#B8A47B;color:#172621;padding:12px 14px;font-size:16px;line-height:1.5}
.ans{display:flex;flex-direction:column;gap:8px;max-width:94%;font-size:16px;line-height:1.5}
.src{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:44px;margin:-10px 0 -12px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.4px;color:#3f5045;text-decoration:underline dotted;text-underline-offset:4px}
.src:hover{color:#172621}
.tab{position:absolute;left:0;width:30px;box-sizing:border-box;padding:16px 0;display:flex;align-items:center;justify-content:center;gap:10px;writing-mode:vertical-rl;transform:rotate(180deg);background:#F3F1E8;border:1px solid #172621;border-right:0;color:#172621;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;z-index:2}
.tab::after{content:'';position:absolute;top:-8px;bottom:-8px;left:-14px;right:0}
.tab-on{background:#B8A47B;color:#172621}
.ob{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;color:#172621;background:transparent;border:1px solid #172621;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border-radius:0;text-decoration:none}
.bp{min-height:48px;border:0;border-radius:0;background:#172621;color:#E8E5D8;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bs{min-height:48px;border:1px solid #172621;border-radius:0;background:transparent;color:#172621;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bd{min-height:48px;border:0;border-radius:0;background:#995F4C;color:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.bd:hover{color:#FFFFFF}
.ficha{display:block;text-decoration:none;color:#172621;background:#F3F1E8;border:0}
.ficha:hover{color:#172621}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px dashed #A9A596}
.stamp{font-family:'IBM Plex Mono',monospace;font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:0;background:#DCE2D8;color:#172621}
.stamp-a{background:#EEDCD3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bar{display:block;position:relative;height:1px;background:#C9C6B8;overflow:hidden}
.bar span{position:absolute;top:0;left:0;height:1px;width:30%;background:#172621;animation:bar 1.6s ease-in-out infinite alternate}
.sn{flex-shrink:0;display:flex;gap:24px;padding:0 20px;height:46px;box-sizing:border-box;border-bottom:1px solid #CFCBBE}
.sni{display:flex;align-items:center;gap:8px;font-size:15px;color:#3f5045;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.sni[aria-current]{color:#172621;font-weight:600;border-bottom-color:#995F4C}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:400;padding:1px 6px;background:#DDD9CB;color:#172621}
@keyframes bar{from{left:0}to{left:70%}}
@media (prefers-reduced-motion: reduce){.bar span{animation:none}}
.sec{display:flex;flex-direction:column;gap:10px}
.seg{flex:1 1 0;min-height:44px;border:0;border-right:1px solid #172621;background:transparent;color:#172621;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;border-radius:0}
.seg:last-child{border-right:0}
.pal{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border:1px solid #172621;cursor:pointer;color:#172621;text-align:left;font-family:'IBM Plex Sans',sans-serif;font-size:15px;border-radius:0;box-sizing:border-box}
.pdot{width:16px;height:16px;border:1px solid #172621;border-radius:50%;flex-shrink:0;box-sizing:border-box}
</style>
</head>
